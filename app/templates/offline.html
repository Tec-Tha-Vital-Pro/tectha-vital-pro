<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Offline · {{ product }}</title>
<style>
:root{--bg:#f7f7f9;--fg:#121214;--muted:#5d6270;--accent:#7b46d1}
@media (prefers-color-scheme: dark){:root{--bg:#0d1613;--fg:#e4ede9;--muted:#9aaca5;--accent:#52c49c}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:24px}
main{max-width:32ch;text-align:center}h1{font-size:1.3rem;margin:16px 0 8px}p{color:var(--muted);margin:0 0 20px}
img{width:64px;height:64px;border-radius:16px}.retry{display:inline-block;font-weight:600;background:var(--accent);color:#fff;text-decoration:none;border-radius:10px;padding:12px 20px;min-height:44px}
</style></head>
<body><main><img src="/static/icons/icon-192.png" alt=""><h1>You're offline</h1>
<p>{{ product }} needs a connection to show patient data. Nothing is stored on this device.</p>
<a class="retry" href="/">Try again</a></main></body></html>
