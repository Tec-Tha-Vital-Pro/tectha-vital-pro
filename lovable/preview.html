 தருகிறது.","Tec Tha Vital మీ ERP, CRM‌లను కలుపుతుంది, WhatsApp‌లో రోగులతో మాట్లాడుతుంది, డాక్టర్లు, సిబ్బంది, యజమానులకు అన్ని శాఖల స్పష్టమైన దృశ్యం ఇస్తుంది.","Tec Tha Vital നിങ്ങളുടെ ERP-യും CRM-ഉം ബന്ധിപ്പിക്കുന്നു, WhatsApp-ൽ രോഗികളോട് സംസാരിക്കുന്നു, ഡോക്ടർമാർക്കും ജീവനക്കാർക്കും ഉടമകൾക്കും എല്ലാ ശാഖകളുടെയും വ്യക്തമായ കാഴ്ച നൽകുന്നു.","Tec Tha Vital ನಿಮ್ಮ ERP ಮತ್ತು CRM ಅನ್ನು ಜೋಡಿಸುತ್ತದೆ, WhatsApp ನಲ್ಲಿ ರೋಗಿಗಳೊಂದಿಗೆ ಮಾತನಾಡುತ್ತದೆ ಮತ್ತು ವೈದ್ಯರು, ಸಿಬ್ಬಂದಿ ಹಾಗೂ ಮಾಲೀಕರಿಗೆ ಎಲ್ಲ ಶಾಖೆಗಳ ಸ್ಪಷ್ಟ ನೋಟ ನೀಡುತ್ತದೆ.","Tec Tha Vital तुमचे ERP व CRM जोडते, व्हॉट्सॲपवर रुग्णांशी बोलते आणि डॉक्टर, कर्मचारी व मालकांना सर्व शाखांचे स्पष्ट चित्र देते.","يربط Tec Tha Vital نظامي ERP وCRM لديك، ويتواصل مع المرضى عبر واتساب، ويمنح الأطباء والموظفين والمالكين رؤية واضحة لكل الفروع.","Tec Tha Vital آپ کے ERP اور CRM کو جوڑتا ہے، واٹس ایپ پر مریضوں سے بات کرتا ہے، اور ڈاکٹروں، عملے اور مالکان کو ہر برانچ کا واضح منظر دیتا ہے۔"],modulesTitle:["Eight modules, one patient record","आठ मॉड्यूल, एक रोगी रिकॉर्ड","எட்டு தொகுதிகள், ஒரே நோயாளர் பதிவு","ఎనిమిది మాడ్యూళ్లు, ఒకే రోగి రికార్డు","എട്ട് മൊഡ്യൂളുകൾ, ഒരൊറ്റ രോഗി രേഖ","ಎಂಟು ಘಟಕಗಳು, ಒಂದೇ ರೋಗಿ ದಾಖಲೆ","आठ मॉड्यूल, एक रुग्ण नोंद","ثماني وحدات، سجل مريض واحد","آٹھ ماڈیولز، ایک مریض ریکارڈ"],whoTitle:["Built for everyone in the hospital","अस्पताल में हर किसी के लिए","மருத்துவமனையில் அனைவருக்கும்","ఆసుపత్రిలో ప్రతి ఒక్కరి కోసం","ആശുപത്രിയിലെ എല്ലാവർക്കും","ಆಸ್ಪತ್ರೆಯ ಎಲ್ಲರಿಗಾಗಿ","रुग्णालयातील प्रत्येकासाठी","مصمَّم لكل من في المستشفى","ہسپتال میں ہر ایک کے لیے"],trustTitle:["Built for Indian healthcare rules","भारतीय स्वास्थ्य नियमों के अनुरूप","இந்திய சுகாதார விதிகளுக்கு ஏற்ப","భారత ఆరోగ్య నిబంధనలకు అనుగుణంగా","ഇന്ത്യൻ ആരോഗ്യ നിയമങ്ങൾക്കനുസരിച്ച്","ಭಾರತೀಯ ಆರೋಗ್ಯ ನಿಯಮಗಳಿಗೆ ಅನುಗುಣವಾಗಿ","भारतीय आरोग्य नियमांनुसार","مصمَّم وفق أنظمة الرعاية الصحية الهندية","بھارتی صحت کے قواعد کے مطابق"],trustBody:["ABDM and ABHA linking, consent records under the DPDP Act 2023, IRDAI claim timelines, and an audit log of every action.","ABDM और ABHA लिंकिंग, DPDP अधिनि  {n} از 5"],tour1:["The owner sees both branches on one screen: OPD, collections, dues and what needs attention.","मालिक एक ही स्क्रीन पर दोनों शाखाएँ देखते हैं: ओपीडी, वसूली, बकाया और ज़रूरी काम।","உரிமையாளர் இரு கிளைகளையும் ஒரே திரையில் பார்க்கிறார்: OPD, வசூல், நிலுவை, கவனிக்க வேண்டியவை.","యజమాని రెండు శాఖలను ఒకే తెరపై చూస్తారు: OPD, వసూళ్లు, బకాయిలు, శ్రద్ధ అవసరమైనవి.","ഉടമ രണ്ട് ശാഖകളും ഒരേ സ്ക്രീനിൽ കാണുന്നു: OPD, പിരിവ്, കുടിശ്ശിക, ശ്രദ്ധിക്കേണ്ടവ.","ಮಾಲೀಕರು ಎರಡೂ ಶಾಖೆಗಳನ್ನು ಒಂದೇ ಪರದೆಯಲ್ಲಿ ನೋಡುತ್ತಾರೆ: OPD, ಸಂಗ್ರಹ, ಬಾಕಿ ಮತ್ತು ಗಮನ ಬೇಕಾದವು.","मालक दोन्ही शाखा एकाच स्क्रीनवर पाहतात: ओपीडी, वसुली, थकबाकी व लक्ष देण्याजोगे.","يرى المالك الفرعين في شاشة واحدة: العيادات والتحصيل والمستحقات وما يحتاج إلى اهتمام.","مالک دونوں برانچیں ایک اسکرین پر دیکھتا ہے: او پی ڈی، وصولی، بقایا اور توجہ طلب امور۔"],tour2:["The front desk runs a fair queue: emergencies, pregnant and elderly patients go first, and each patient sees a wait estimate.","रिसेप्शन निष्पक्ष कतार चलाता है: आपातकालीन, गर्भवती और बुज़ुर्ग पहले, और हर रोगी को अनुमानित प्रतीक्षा दिखती है।","வரவேற்பு நியாயமான வரிசையை நடத்துகிறது: அவசர, கர்ப்பிணி, முதியோர் முதலில்; ஒவ்வொருவருக்கும் காத்திருப்பு மதிப்பீடு.","రిసెప్షన్ న్యాయమైన క్యూ నడుపుతుంది: అత్యవసర, గర్భిణి, వృద్ధులు ముందు; ప్రతి రోగికి వేచి సమయం అంచనా.","റിസപ്ഷൻ നീതിയുക്തമായ ക്യൂ നടത്തുന്നു: അടിയന്തര, ഗർഭിണി, വയോധികർ ആദ്യം; ഓരോരുത്തർക്കും കാത്തിരിപ്പ് സമയം.","ಸ್ವಾಗತ ನ್ಯಾಯಯುತ ಸರತಿ ನಡೆಸುತ್ತದೆ: ತುರ್ತು, ಗರ್ಭಿಣಿ, ಹಿರಿಯರು ಮೊದಲು; ಪ್ರತಿಯೊಬ್ಬರಿಗೂ ಕಾಯುವ ಅಂದಾಜು.","स्वागत कक्ष न्याय्य रांग चालवतो: आणीबाणी, गर्भवती व ज्येष्ठ आधी; प्रत्येकाला प्रतीक्षेचा अंदाज.","ينظّم الاستقبال طابوراً عادلاً: الحالات الطارئة والحوامل وكبار السن أولاً، مع وقت انتظار متوقع لكل مريض.","استقبالیہ منصفانہ قطار چلاتا ہے: ایمرجنسی، حاملہ اور بزرگ پہلے، اور ہر مریض کو متوقع انتظار دکھتا ہے۔"],tour3:["Doctors get an early-warning score from vitals and an AI triage list. AI only suggests; the doctor reviews and decides.","डॉक्टरों को वाइटल्स से प्रारंभिक चेतावनी स्कोर और एआई ट्राइएज सूची मिलती है। एआई केवल सुझाव देता है; डॉक्टर तय करते हैं।","மருத்துவர்களுக்கு உயிர் அறிகுறிகளிலிருந்து முன்னெச்சரிக்கை மதிப்பெண், AI முன்னுரிமைப் பட்டியல். AI பரிந்துரை மட்டுமே; மருத்துவரே முடிவு செய்வார்.","డాక్టర్లకు వైటల్స్ నుంచి ముందస్తు హెచ్చరిక స్కోర్, AI ట్రయాజ్ జాబితా. AI సూచిస్తుంది మాత్రమే; నిర్ణయం డాక్టర్‌దే.","ഡോക്ടർമാർക്ക് വൈറ്റൽസിൽ നിന്ന് മുൻകൂർ മുന്നറിയിപ്പ് സ്കോറും AI ട്രയാജ് പട്ടികയും. AI നിർദേശിക്കുക മാത്രം; ഡോക്ടർ തീരുമാനിക്കുന്നു.","ವೈದ್ಯರಿಗೆ ಪ್ರಮುಖ ಲಕ್ಷಣಗಳಿಂದ ಮುನ್ನೆಚ್ಚರಿಕೆ ಸ್ಕೋರ್ ಮತ್ತು AI ಟ್ರಯಾಜ್ ಪಟ್ಟಿ. AI ಸಲಹೆ ಮಾತ್ರ; ವೈದ್ಯರೇ ನಿರ್ಧರಿಸುತ್ತಾರೆ.","डॉक्टरांना व्हायटल्सवरून पूर्वसूचना गुण व एआय ट्रायाज यादी मिळते. एआय फक्त सुचवते; निर्णय डॉक्टरांचा.","يحصل الأطباء على مؤشر إنذار مبكر من العلامات الحيوية وقائمة فرز ذكية. الذكاء الاصطناعي يقترح فقط؛ والطبيب يقرر.","ڈاکٹروں کو وائٹلز سے ابتدائی انتباہی اسکور اور اے آئی ٹرائیج فہرست ملتی ہے۔ اے آئی صرف تجویز دیتا ہے؛ فیصلہ ڈاکٹر کرتا ہے۔"],tour4:["Billing sees dues by age, and an agent finds services that were done but never billed.","बिलिंग पुराने बकाया देखता है, और एजेंट उन सेवाओं को खोजता है जो दी गईं पर बिल नहीं हुईं।","பில்லிங் நிலுவையைக் காலவாரியாகப் பார்க்கிறது; செய்யப்பட்டும் பில் செய்யப்படாத சேவைகளை முகவர் கண்டறிகிறது.","బిల్లింగ్ బకాయిలను వయస్సు వారీగా చూస్తుంది; చేసినా బిల్ చేయని సేవలను ఏజెంట్ కనుగొంటుంది.","ബില്ലിംഗ് കുടിശ്ശിക കാലാനുസൃതമായി കാണുന്നു; ചെയ്തിട്ടും ബിൽ ചെയ്യാത്ത സേവനങ്ങൾ ഏജന്റ് കണ്ടെത്തുന്നു.","ಬಿಲ್ಲಿಂಗ್ ಬಾಕಿಯನ್ನು ಅವಧಿಯ ಪ್ರಕಾರ ನೋಡುತ್ತದೆ; ಮಾಡಿದರೂ ಬಿಲ್ ಮಾಡದ ಸೇವೆಗಳನ್ನು ಏಜೆಂಟ್ ಹುಡುಕುತ್ತದೆ.","बिलिंग थकबाकी वयानुसार पाहते; दिलेल्या पण बिल न केलेल्या सेवा एजंट शोधतो.","يرى قسم الفوترة المستحقات حسب عمرها، ويكتشف الوكيل خدمات قُدّمت ولم تُفوتَر.","بلنگ بقایا جات عمر کے لحاظ سے دیکھتا ہے، اور ایجنٹ ایسی خدمات ڈھونڈتا ہے جو دی گئیں مگر بل نہیں ہوئیں۔"],tour5:["Insurance claims show live timers against IRDAI limits, so no patient waits for discharge.","बीमा दावे IRDAI सीमाओं के सामने लाइव टाइमर दिखाते हैं, ताकि कोई रोगी डिस्चार्ज के लिए इंतज़ार न करे।","காப்பீட்டுக் கோரிக்கைகள் IRDAI வரம்புகளுக்கு எதிராக
